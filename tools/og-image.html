<!doctype html>
<!--
  Social preview (og:image) template, 1200x630 - the size LinkedIn, WhatsApp, Slack and X
  crop to. Rendered to JPG by headless Chrome, never served: see tools/og-images.sh.
  Everything comes from the query string: title, kicker, desc, img, pos (object-position), fit,
  and photo=1 for the home page's transparent cutout over the About gradient.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: 'Mona Sans';
        src: url('../public/fonts/mona-sans-var.woff2') format('woff2-variations');
        font-weight: 200 900;
        font-stretch: 75% 125%;
      }
      :root {
        --bg: #0a0a0a;
        --text: #f2f2f2;
        --dim: #9a9a9a;
        --accent: #ff6a13;
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: var(--bg);
      }
      body {
        position: relative;
        display: grid;
        grid-template-columns: 1fr 470px;
        gap: 56px;
        padding: 64px;
        font-family: 'Mona Sans', sans-serif;
        color: var(--text);
        /* the site's blueprint grid, faint */
        background-image:
          linear-gradient(rgb(255 255 255 / 0.035) 1px, transparent 1px),
          linear-gradient(90deg, rgb(255 255 255 / 0.035) 1px, transparent 1px);
        background-size: 40px 40px;
      }
      /* registration brackets in two corners, the site's own tell */
      body::before,
      body::after {
        content: '';
        position: absolute;
        width: 28px;
        height: 28px;
        border: 0 solid rgb(255 255 255 / 0.25);
      }
      body::before {
        top: 24px;
        left: 24px;
        border-top-width: 2px;
        border-left-width: 2px;
      }
      body::after {
        right: 24px;
        bottom: 24px;
        border-right-width: 2px;
        border-bottom-width: 2px;
      }
      .text {
        display: flex;
        flex-direction: column;
        min-width: 0;
      }
      .mark {
        font-weight: 800;
        font-stretch: 118%;
        font-size: 30px;
        color: var(--accent);
      }
      .kicker {
        margin-top: auto;
        font-size: 22px;
        color: var(--accent);
      }
      h1 {
        margin-top: 14px;
        font-weight: 800;
        font-stretch: 118%;
        font-size: 64px;
        line-height: 1.02;
        letter-spacing: -0.035em;
        text-wrap: balance;
      }
      h1 em {
        font-style: normal;
        color: var(--accent);
      }
      .desc {
        margin-top: 22px;
        font-size: 23px;
        line-height: 1.4;
        color: var(--dim);
        text-wrap: pretty;
      }
      .url {
        margin-top: auto;
        padding-top: 28px;
        font-size: 19px;
        color: var(--dim);
      }
      .visual {
        position: relative;
        align-self: stretch;
        border-radius: 18px;
        overflow: hidden;
        border: 1px solid #222;
        background: #121212;
      }
      .visual img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      /* the About photo: a transparent cutout, so its gradient is drawn here as on the site */
      .visual.photo {
        background: linear-gradient(
          to bottom,
          var(--accent) 0%,
          #c8520d 12.5%,
          #8a3706 25%,
          #5e2101 37.5%,
          #3e1400 50%,
          #230a00 62.5%,
          #0e0302 75%,
          #030001 87.5%,
          #000 100%
        );
      }
      .visual.photo img {
        object-fit: contain;
        object-position: bottom;
      }
    </style>
  </head>
  <body>
    <div class="text">
      <p class="mark">LS</p>
      <p class="kicker"></p>
      <h1></h1>
      <p class="desc"></p>
      <p class="url">lucascattolin.com</p>
    </div>
    <div class="visual"><img alt="" /></div>
    <script>
      const q = new URLSearchParams(location.search);
      document.querySelector('.kicker').textContent = q.get('kicker') || '';
      // *word* in the title turns orange, the way the hero does "3D"
      document.querySelector('h1').innerHTML = (q.get('title') || '')
        .replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[c])
        .replace(/\*(.+?)\*/g, '<em>$1</em>');
      document.querySelector('.desc').textContent = q.get('desc') || '';
      document.querySelector('.visual img').src = q.get('img') || '';
      if (q.get('photo')) document.querySelector('.visual').classList.add('photo');
      if (q.get('pos')) document.querySelector('.visual img').style.objectPosition = q.get('pos');
      // landscape covers (UI mockups) shown whole: cropped into this portrait frame they lost
      // half their labels
      if (q.get('fit')) document.querySelector('.visual img').style.objectFit = q.get('fit');
    </script>
  </body>
</html>
