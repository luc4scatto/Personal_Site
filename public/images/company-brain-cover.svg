    <line x1="300" y1="740" x2="840" y2="740" stroke="#ffffff" stroke-opacity=".25" stroke-width="2"/>
    <g fill="#f2f2f2" font-size="26"><text x="900" y="480">Category B is the widest</text><text x="900" y="530">range in the collection.</text></g>
    <g font-size="22"><rect x="900" y="590" width="190" height="46" rx="23" fill="#ff6a13" fill-opacity=".18" stroke="#ff6a13" stroke-opacity=".5" stroke-width="2"/><text x="924" y="622" fill="#ff6a13">Technical data</text>
    <rect x="1110" y="590" width="150" height="46" rx="23" fill="#5c8dff" fill-opacity=".18" stroke="#5c8dff" stroke-opacity=".5" stroke-width="2"/><text x="1136" y="622" fill="#5c8dff">Catalog</text></g>
