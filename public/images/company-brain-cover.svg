<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-label="Redrawn chat: a question about a model, an answer with sources and a small price chart">
  <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1d1d1d"/><stop offset="1" stop-color="#101010"/></linearGradient></defs>
  <rect width="1600" height="1000" fill="url(#g)"/>
  <g font-family="Space Grotesk, Arial, sans-serif">
    <rect x="200" y="90" width="1200" height="820" rx="28" fill="#0a0a0a" stroke="#ffffff" stroke-opacity=".12" stroke-width="2"/>
    <circle cx="250" cy="140" r="8" fill="#ff6a13"/><circle cx="282" cy="140" r="8" fill="#5c8dff"/><circle cx="314" cy="140" r="8" fill="#ffffff" fill-opacity=".25"/>
